name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Test (pytest)
        run: pytest test_app.py -v

      - name: Run Selenium UI Test (headless)
        run: pytest test_ui.py -v

      - name: Deploy to production (simulated)
        if: success()
        run: echo "All tests passed! Application successfully deployed to production."
